[package]
name = "calendar"
version = "0.0.1"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = { version = "0.4", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
state = { path = "../state" }
