[package]
name = "state"
version = "0.0.1"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
