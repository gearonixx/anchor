[package]
name = "transport"
version = "0.0.1"
edition = "2024"
default-run = "start" # picks which bin `cargo run` starts

[lib]
name = "transport"
path = "src/lib.rs"

[[bin]]
name = "start"
path = "src/main.rs"

[[bin]]
name = "auth"
path = "src/bin/auth.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
grammers-client = { version = "0.10.0", features = ["fs", "html"] }
grammers-session = "0.10.0"
grammers-mtsender = "0.10.0"
log = { version = "0.4", features = ["std"] }
tokio = { version = "1.53.1", features = ["full"] }
dotenvy = "0.15.7"
emojis = "0.9.0"
unicode-segmentation = "1.13.3"
state = { path = "../state" }
events = { path = "../events" }
scheduler = { path = "../scheduler" }
config = { path = "../config" }
reply-timing = { path = "../reply-timing" }
