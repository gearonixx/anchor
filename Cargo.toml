[workspace]
members = ["crates/calendar", "crates/reply-timing", "crates/state", "crates/events", "crates/config", "crates/scheduler", "crates/transport", "crates/forecast"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
